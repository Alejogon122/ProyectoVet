<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" opacity="0.18">
  <!-- Estilo plano sin degradados -->
  <g fill="#334155">
    <!-- 1. Huella de pata principal (centro superior) -->
    <g transform="translate(40, 30) scale(0.9)">
      <ellipse cx="25" cy="35" rx="14" ry="17" />
      <circle cx="10" cy="14" r="6" />
      <circle cx="21" cy="8" r="6" />
      <circle cx="33" cy="8" r="6" />
      <circle cx="43" cy="14" r="6" />
    </g>

    <!-- 2. Silueta de Gato (derecha superior) -->
    <g transform="translate(190, 25) scale(0.85)">
      <!-- Cabeza con orejas -->
      <polygon points="12,12 18,30 32,30 38,12 42,38 8,38" />
      <!-- Cuerpo y cola -->
      <path d="M 14,35 Q 25,32 36,35 Q 44,48 40,65 Q 25,68 10,65 Q 6,48 14,35 Z" />
      <path d="M 38,62 Q 52,60 50,42 Q 47,40 45,43 Q 46,55 35,58 Z" />
    </g>

    <!-- 3. Huesito (centro) -->
    <g transform="translate(125, 120) rotate(-25) scale(0.8)">
      <rect x="15" y="10" width="35" height="10" rx="3" />
      <circle cx="15" cy="8" r="6" />
      <circle cx="15" cy="22" r="6" />
      <circle cx="50" cy="8" r="6" />
      <circle cx="50" cy="22" r="6" />
    </g>

    <!-- 4. Silueta de Perro sentado (izquierda centro) -->
    <g transform="translate(25, 150) scale(0.85)">
      <!-- Cabeza y hocico -->
      <ellipse cx="28" cy="22" rx="10" ry="12" />
      <path d="M 28,18 Q 42,22 36,28 Q 28,30 25,28 Z" />
      <!-- Oreja caída -->
      <ellipse cx="20" cy="22" rx="5" ry="10" transform="rotate(15 20 22)" />
      <!-- Cuerpo -->
      <path d="M 20,30 Q 32,32 30,58 Q 16,60 14,50 Q 12,38 20,30 Z" />
      <!-- Pata delantera y cola -->
      <rect x="25" y="45" width="6" height="20" rx="3" />
      <path d="M 14,56 Q 2,52 4,40 Q 7,42 7,50 Z" />
    </g>

    <!-- 5. Huella secundaria (abajo centro-derecha) -->
    <g transform="translate(200, 160) scale(0.75)">
      <ellipse cx="25" cy="35" rx="14" ry="17" />
      <circle cx="10" cy="14" r="6" />
      <circle cx="21" cy="8" r="6" />
      <circle cx="33" cy="8" r="6" />
      <circle cx="43" cy="14" r="6" />
    </g>

    <!-- 6. Pajarito / Ave (centro superior-derecha) -->
    <g transform="translate(130, 45) scale(0.75)">
      <circle cx="22" cy="18" r="9" />
      <polygon points="29,16 38,20 29,22" />
      <path d="M 15,22 Q 4,28 10,38 Q 24,38 26,26 Z" />
      <polygon points="10,35 2,42 12,38" />
    </g>

    <!-- 7. Conejo / Orejas largas (abajo derecha) -->
    <g transform="translate(210, 225) scale(0.8)">
      <!-- Orejas -->
      <ellipse cx="20" cy="14" rx="4" ry="12" transform="rotate(-10 20 14)" />
      <ellipse cx="28" cy="14" rx="4" ry="12" transform="rotate(10 28 14)" />
      <!-- Cabeza y cuerpo -->
      <circle cx="24" cy="28" r="10" />
      <ellipse cx="24" cy="45" rx="14" ry="12" />
      <circle cx="38" cy="46" r="4" />
    </g>

    <!-- 8. Pececito (abajo izquierda) -->
    <g transform="translate(45, 240) scale(0.75)">
      <ellipse cx="30" cy="20" rx="18" ry="11" />
      <polygon points="15,20 2,10 2,30" />
      <circle cx="40" cy="17" r="2.5" fill="#e2e8f0" />
    </g>

    <!-- 9. Cruz médica veterinaria / Corazón (centro) -->
    <g transform="translate(135, 220) scale(0.8)">
      <path d="M 20,8 A 7,7 0 0,0 6,17 Q 6,28 20,38 Q 34,28 34,17 A 7,7 0 0,0 20,8 Z" />
    </g>
  </g>
</svg>
